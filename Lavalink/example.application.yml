server:
  port: 2333
  address: 0.0.0.0
lavalink:
  server:
    sources:
      youtube: false # Using Youtube nativly on lavalink is deprecated, disable it and use https://github.com/lavalink-devs/youtube-source instead.
    password: "youshallnotpass"
    bufferDurationMs: 225
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 3
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 5000
    playerUpdateInterval: 3
    useSeekGhosting: true
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3" # LavaSrc - for extra sources like deezer, spotify, etc. https://github.com/topi314/LavaSrc
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0" # https://github.com/topi314/LavaSearch
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.dunctebot:skybot-lavalink-plugin:1.7.0" # https://github.com/DuncteBot/skybot-lavalink-plugin
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.devoxin:lavadspx-plugin:0.0.5" # https://github.com/devoxin/LavaDSPX-Plugin
      repository: "https://jitpack.io"
    # https://github.com/lavalink-devs/youtube-source
    # Snapshot versions are the BARE 40-char commit hash - NOT "<hash>-SNAPSHOT".
    # YouTube fixes land on main weeks before a release is tagged, so a release
    # number (or `latest.release`) will usually be broken. To find the newest
    # main commit that actually has a published jar:
    #   curl -s "https://maven.lavalink.dev/api/maven/details/snapshots/dev/lavalink/youtube/youtube-plugin" \
    #     | grep -oE '"name":"[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' | sort > /tmp/snap.txt
    #   curl -s "https://api.github.com/repos/lavalink-devs/youtube-source/commits?sha=main&per_page=100" \
    #     | grep -oE '"sha": "[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' > /tmp/main.txt
    #   grep -nxFf /tmp/snap.txt /tmp/main.txt | head -1
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0" # https://github.com/topi314/LavaLyrics
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "me.duncte123:java-lyrics-plugin:1.6.6" # https://github.com/DuncteBot/java-timed-lyrics
      repository: "https://maven.lavalink.dev/releases"
plugins:
  lyrics:
    countryCode: en-AU
    geniusApiKey: "<insert>"
  lavalyrics:
    sources:
      - genius
      - spotify
      - youtube
      - deezer
      - yandexMusic
  youtube:
    enabled: true
    # YouTube's cipher changes are becoming more frequent and complex, making it harder to keep up.
    # To simplify signature deciphering, you can use a remote cipher server like yt-cipher, a lightweight Deno server with a REST API. More details are available at https://github.com/kikkia/yt-cipher
    # Signature/n deciphering is no longer maintained in-Java upstream, so this
    # is effectively required: without it you get
    # "ScriptExtractionException: Must find sig function from script: .../base.js"
    # The public instance needs no password (10 req/s, fine past 1000 players).
    # If self-hosting inside Docker use the service name - `localhost` is the
    # Lavalink container itself.
    remoteCipher:
      url: "https://cipher.kikkia.dev"
      userAgent: "lavamusic"
      retries: 3
      retryDelay: 500
    oauth:
      enabled: false
      # refreshToken: "Insert your refresh token here" # For more details, please refer to https://github.com/lavalink-devs/youtube-source?tab=readme-ov-file#using-oauth-tokens
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # For more details about client setup, refer to https://github.com/lavalink-devs/youtube-source?tab=readme-ov-file#available-clients
    # Queried in order until one returns a playable response. This order was
    # measured against real videos - re-measure from your own IP, because the
    # bot-check gate is IP-reputation based (see probe instructions in the repo).
    clients:
      - "IOS"
      - "TV"
      - "MUSIC"
      - "TVHTML5_SIMPLY"
      - "ANDROID_VR"
      - "WEB"
      - "MWEB"
    # Per-client capability toggles MUST be nested under `clientOptions`.
    # YoutubeConfig binds a Map<String, ClientOptions> at
    # plugins.youtube.clientOptions, so bare top-level client keys (which this
    # file used to have, and which most Lavalink configs copy) match no
    # property and are SILENTLY IGNORED.
    #
    # Whichever client comes first and claims `searching` handles search. IOS
    # streams reliably but returns nothing for search, so it must not claim it -
    # otherwise every search comes back loadType:empty.
    # Leave playlistLoading on for IOS: TV has no metadata support at all and
    # TVHTML5_SIMPLY has no playlist support.
    clientOptions:
      IOS:
        searching: false
      TV:
        searching: false
      MUSIC:
        playback: false
        videoLoading: false
        playlistLoading: false
      TVHTML5_SIMPLY:
        searching: false
      ANDROID_VR:
        searching: false
      MWEB:
        searching: false
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "dzisrc:%ISRC%"

      - "ytsearch:%QUERY%"
      - "dzsearch:%QUERY%"
      - "jssearch:%QUERY%"
      - "pdsearch:%QUERY%"
      - "scsearch:%QUERY%"
      - "tdsearch:%QUERY%"
    sources:
      spotify: true # Enable Spotify source
      applemusic: true # Enable Apple Music source
      deezer: true # Enable Deezer source
      jiosaavn: true # Enabled JioSaavn source
      pandora: true # Enable Pandora source
      yandexmusic: true # Enable Yandex Music source
      flowerytts: true # Enable Flowery TTS source
      youtube: true # Enable YouTube search source (https://github.com/topi314/LavaSearch)
      tidal: true # Enable Tidal source
      vkmusic: true # Enable Vk Music source
      qobuz: true # Enabled qobuz source
      ytdlp: true # Enable yt-dlp source
    lyrics-sources:
      spotify: true # Enable Spotify lyrics source
      deezer: true # Enable Deezer lyrics source
      youtube: true # Enable YouTube lyrics source
      yandexmusic: true # Enable Yandex Music lyrics source
      vkmusic: true # Enable Vk Music lyrics source
      lrcLib: true # Enable LRC Library lyrics source (https://lrclib.net)
    spotify:
      # clientId & clientSecret are required for using spsearch
#      clientId: "your client id"
#      clientSecret: "your client secret"
      # spDc: "your sp dc cookie" # the sp dc cookie used for accessing the spotify lyrics api
      countryCode: "US" # the country code you want to use for filtering the artists top tracks. See https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
      playlistLoadLimit: 6 # The number of pages at 100 tracks each (also used to derive Spotify Partner API playlist track limit)
      albumLoadLimit: 6 # The number of pages at 50 tracks each (also used to derive Spotify Partner API album track limit)
      resolveArtistsInSearch: true # Whether to resolve artists in track search results (can be slow)
      localFiles: false # Enable local files support with Spotify playlists. Please note `uri` & `isrc` will be `null` & `identifier` will be `"local"`
      preferPartnerApi: false # When true, Spotify search uses partner API by default; when false, search uses Spotify v1 API.
      preferV1SearchApi: false # Only used when preferPartnerApi is true. Set true to force Spotify v1 search instead of partner search.
      customTokenEndpoint: "http://localhost:8080/api/token" # Optional custom endpoint for getting the anonymous token. If not set, spotify's default endpoint will be used which might not work. The response must match spotify's anonymous token response format.
    applemusic:
      countryCode: "US"
      mediaAPIToken: "<insert>"
      playlistLoadLimit: 3 # The number of pages at 300 tracks each
      albumLoadLimit: 3 # The number of pages at 300 tracks each
    deezer:
      masterDecryptionKey: "your master decryption key" # the master key used for decrypting the deezer tracks. (you need to get it from somewhere)
      arl: "your deezer arl" # the arl cookie used for accessing the deezer api this is not optional anymore
      formats: ["FLAC", "MP3_320", "MP3_256", "MP3_128", "MP3_64", "AAC_64"] # the formats you want to use for the deezer tracks. "FLAC", "MP3_320", "MP3_256" & "AAC_64" are only available for premium users and require a valid arl
    youtube:
      countryCode: "US"
      playlistLoadLimit: 1 # The number of pages at 100 tracks each
      albumLoadLimit: 1 # The number of pages at 50 tracks each
      artistLoadLimit: 1 # The number of pages at 10 tracks each
    yandexmusic:
      accessToken: "<insert>"
    tidal:
      countryCode: "US" # the country code for accessing region-specific content on Tidal (ISO 3166-1 alpha-2).
      searchLimit: 6 # How many search results should be returned
      token: "your tidal token" # the token used for accessing the tidal api. See https://github.com/topi314/LavaSrc#tidal
    qobuz:
      userOauthToken: "your user oauth token" # This token is needed for authorization in the api. Guide: https://github.com/topi314/LavaSrc#qobuz
      #      appId : optional (Only pass it when you are using an old userOauthToken)
      #      appSecret : optional (Only pass it when you are using an old userOauthToken)
    ytdlp:
      path: "yt-dlp" # the path to the yt-dlp executable.
      searchLimit: 10 # How many search results should be returned
      mixPlaylistLoadLimit: 25 # The number of tracks each for mix playlists. Default is 25 tracks
      playlistLoadLimit: 1000 # The number of tracks each for normal playlists. Default is 1000 tracks
#      customLoadArgs: ["-q", "--no-warnings", "--flat-playlist", "--skip-download", "-J"] # Custom arguments to pass to yt-dlp
    jiosaavn:
      decryption: # The decryption configuration for the JioSaavn tracks
        secretKey: "your_key" # The required secret key used for decryption (Find your own secret key)
        algorithm: "DES" # The algorithm used for decryption (Default "DES")
        transformation: "DES/ECB/PKCS5Padding" # The transformation used for decryption (Default "DES/ECB/PKCS5Padding")
      # proxy: # If defined, JioSaavn HTTP requests will be proxied through here. JioSaavn uses region blocking
      #   url: "https://example.org" # The HTTP proxy to use
      #   username: "my-bot" # Optional username to authenticate with the proxy
      #   password: "youshallpass" # Optional password to authenticate with the proxy
    pandora:
      csrfToken: "your csrf token" # X-CsrfToken header from your browser session to pandora.com
      searchLimit: 6 # How many search results should be returned
    vkmusic:
      userToken: "your user token" # This token is needed for authorization in the api. Guide: https://github.com/topi314/LavaSrc#vk-music
      playlistLoadLimit: 1 # The number of pages at 50 tracks each
      artistLoadLimit: 1 # The number of pages at 10 tracks each
      recommendationsLoadLimit: 10 # Number of tracks
    flowerytts:
      voice: "Olivia" # (case-sensitive) get default voice from here https://api.flowery.pw/v1/tts/voices
      translate: false # whether to translate the text to the native language of voice
      silence: 0 # the silence parameter is in milliseconds. Range is 0 to 10000. The default is 0.
      speed: 1.0 # the speed parameter is a float between 0.5 and 10. The default is 1.0. (0.5 is half speed, 2.0 is double speed, etc.)
      audioFormat: "mp3" # supported formats are: mp3, ogg_opus, ogg_vorbis, aac, wav, and flac. Default format is mp3
  dunctebot:
    ttsLanguage: "en-US"
    sources:
      getyarn: true # www.getyarn.io
      clypit: true # www.clyp.it
      tts: true # speak:Words to speak
      pornhub: true # should be self-explanatory
      reddit: true # should be self-explanatory
      ocremix: true # www.ocremix.org
      tiktok: true # tiktok.com
      mixcloud: true # mixcloud.com
      soundgasm: true # soundgasm.net
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
sentry:
  dsn: ""
  environment: ""
logging:
  file:
    max-history: 5
    max-size: 10MB
  path: ./logs/
  level:
    root: DEBUG
    lavalink: DEBUG
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: true
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
